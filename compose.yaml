services:

  app:
    build: .
    container_name: url-shortner
    ports:
      - "8001:8001"
    environment:
      MONGO_URI: mongodb://mongo:27017/short-url
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo-data: